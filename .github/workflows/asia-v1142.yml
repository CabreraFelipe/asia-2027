name: Asia 2027 - paquete PWA aislado V11.42
on:
  push:
    branches: ['validation/v11993']
    paths: ['staging/source/V11.42-INTEGRACION/**','.github/workflows/asia-v1142.yml']
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'CabreraFelipe/asia-2027' && github.ref == 'refs/heads/validation/v11993'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: node staging/source/V11.29-INTEGRACION/tests/build-candidate.mjs
      - run: node staging/source/V11.39-INTEGRACION/tests/patch-candidate.mjs
      - run: node staging/source/V11.40-INTEGRACION/tests/patch-candidate.mjs
      - run: node staging/source/V11.42-INTEGRACION/tests/build.mjs
      - run: node staging/source/V11.42-INTEGRACION/tests/package.test.mjs
      - name: Regresión Chrome mantenimiento integrado
        env:
          ASIA_BROWSER_PREFIX: /staging/source/V11.41-INTEGRACION/tests
          ASIA_CANDIDATE: '1'
        run: node staging/source/V11.26-INTEGRACION/tests/run-browser.mjs
