name: Asia 2027 - CI de fuentes y smoke real
on:
  push:
    branches: ['development/multiuser']
    paths: ['staging/source/**', '.github/workflows/asia-source-ci.yml']
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'CabreraFelipe/asia-2027' && github.ref == 'refs/heads/development/multiuser'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Probar fuentes versionadas sin utilizar ZIP ni credenciales
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          cp -a staging/source/. "$dir/"
          cd "$dir"
          node official/PREFLIGHT_PORTABLE_V11_24.mjs
          cp -a official/V11.24-STAGING/. BASE_V11.24/
          node recuperar-v106.mjs "$GITHUB_WORKSPACE"
          node VERIFICAR_V11_25.mjs
          echo 'CI de fuentes versionadas OK. Sin escrituras remotas.'
  smoke:
    if: github.repository == 'CabreraFelipe/asia-2027' && github.ref == 'refs/heads/development/multiuser'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Smoke original V11.24, GET sin sesión
        run: node staging/source/official/V11.24-STAGING/scripts/smoke1124.mjs
  document-inspector:
    if: github.repository == 'CabreraFelipe/asia-2027' && github.ref == 'refs/heads/development/multiuser'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and test isolated document sanitizer (synthetic fixtures only)
        run: |
          set -euo pipefail
          docker build -t asia-document-inspector:ci staging/source/V11.42-INTEGRACION/document-inspector
          timeout 90s docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 512m --cpus 1 --tmpfs /tmp:rw,noexec,nosuid,size=96m --entrypoint /usr/bin/python3 asia-document-inspector:ci /app/test_inspector.py
