name: Asia 2027 - comprobar conexión staging
on:
  push:
    branches: ['development/multiuser']
    paths: ['staging/CONNECT.md']
permissions: {}
concurrency:
  group: asia-staging-connection
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'CabreraFelipe/asia-2027' && github.ref == 'refs/heads/development/multiuser'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: asia-staging
    steps:
      - name: Verificar acceso al Worker existente (solo GET)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.error, sys
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          if not token or not re.fullmatch(r'[a-fA-F0-9]{32}', account):
              sys.exit('Faltan secretos del entorno asia-staging o Account ID inválido.')
          worker = 'asia-v1111-identity-staging'
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{worker}/settings'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}, method='GET')
          try:
              with opener.open(req, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              sys.exit(f'Cloudflare rechazó la consulta (HTTP {exc.code}). Revisar cuenta, permisos y Worker.')
          except Exception:
              sys.exit('No se pudo verificar la conexión a Cloudflare.')
          if not isinstance(data, dict) or data.get('success') is not True or not isinstance(data.get('result'), dict):
              sys.exit('Respuesta inesperada de Cloudflare.')
          print('Conexión verificada: lectura del Worker asia-v1111-identity-staging.')
          print('No se ejecutaron escrituras, despliegues, consultas D1 ni migraciones.')
          PY
