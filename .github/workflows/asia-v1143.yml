name: Asia 2027 - paquete completo Chrome V11.43
on:
  push:
    branches: ['validation/notification-webpush-provider']
    paths: ['staging/source/V11.43-INTEGRACION/**','staging/source/V11.42-INTEGRACION/**','.github/workflows/asia-v1143.yml']
permissions:
  contents: read
jobs:
  chrome:
    if: github.repository == 'CabreraFelipe/asia-2027' && github.ref == 'refs/heads/validation/notification-webpush-provider'
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, slow]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: node staging/source/V11.29-INTEGRACION/tests/build-candidate.mjs
      - run: node staging/source/V11.39-INTEGRACION/tests/patch-candidate.mjs
      - run: node staging/source/V11.40-INTEGRACION/tests/patch-candidate.mjs
      - run: node staging/source/V11.42-INTEGRACION/tests/build.mjs
      - run: node staging/source/V11.42-INTEGRACION/tests/package.test.mjs
      - name: Chrome normal
        if: matrix.mode == 'normal'
        run: node staging/source/V11.43-INTEGRACION/tests/package-browser.mjs
      - name: Chrome recurso secundario lento
        if: matrix.mode == 'slow'
        env:
          ASIA_SLOW_DIARY: '1'
        run: node staging/source/V11.43-INTEGRACION/tests/package-browser.mjs
  pilot:
    if: always() && github.repository == 'CabreraFelipe/asia-2027' && github.ref == 'refs/heads/validation/notification-webpush-provider'
    needs: chrome
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir ambas variantes completas
        env:
          MATRIX_RESULT: ${{ needs.chrome.result }}
        run: test "$MATRIX_RESULT" = success
