<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobación local V8.4 · IndexedDB</title><style>body{background:#0b1422;color:#f5f5f5;font:16px system-ui;padding:24px;max-width:720px;margin:auto}h1{color:#ffb037}button{background:#ffb037;color:#111;padding:12px;border:0;border-radius:8px;font:inherit}pre{white-space:pre-wrap}</style><h1>Comprobación de IndexedDB</h1><p>Usa una base temporal de prueba independiente. No toca registros reales ni realiza conexiones externas.</p><button id="run">Ejecutar comprobaciones</button><pre id="results" role="status"></pre><script type="module">
import {openStore} from './store84.mjs';
const btn=document.querySelector('#run'),out=document.querySelector('#results');
if(location.protocol!=='https:'||location.hostname!=='cabrerafelipe.github.io'){btn.disabled=true;out.textContent='Entorno no autorizado.'}
function log(s){out.textContent+=s+'\n'}
function eq(a,b){if(JSON.stringify(a)!==JSON.stringify(b))throw Error('Resultado inesperado')}
async function rejects(p){try{await p}catch{return}throw Error('Se esperaba un conflicto')}
btn.onclick=async()=>{btn.disabled=true;out.textContent='';const name='asia84-check-'+crypto.randomUUID();const factory={open:(_,v)=>indexedDB.open(name,v)};let a,b;try{a=await openStore(factory);b=await openStore(factory);eq((await a.read('gym')).revision,0);log('✓ Base vacía');const saved=await a.write('gym',0,{value:1});eq(saved.revision,1);eq((await b.read('gym')).payload,{value:1});log('✓ Escritura y lectura entre conexiones');await rejects(b.write('gym',0,{value:2}));eq((await a.read('gym')).payload,{value:1});log('✓ Conflicto de revisión');const results=await Promise.allSettled([a.write('gym',1,{value:3}),b.write('gym',1,{value:4})]);eq(results.filter(x=>x.status==='fulfilled').length,1);log('✓ Dos guardados concurrentes, uno rechazado');const before=await a.readPair();await rejects(a.replacePair({preferences:before.preferences.revision,gym:0},{preferences:{value:99},gym:{value:99}}));eq(await b.readPair(),before);log('✓ Restauración conflictiva: ninguna modificación');await a.replacePair({preferences:before.preferences.revision,gym:before.gym.revision},{preferences:{value:10},gym:{value:20}});a.close();b.close();a=await openStore(factory);eq((await a.read('gym')).payload,{value:20});eq((await a.read('preferences')).payload,{value:10});log('✓ Restauración atómica y persistencia tras reapertura');log('Todas las comprobaciones completadas. No equivale a validar almacenamiento lleno o Safari iOS.') }catch(e){log('✗ '+e.message)}finally{a?.close();b?.close();const r=indexedDB.deleteDatabase(name);r.onsuccess=()=>log('✓ Base temporal eliminada');r.onblocked=()=>log('No se pudo eliminar: otra conexión abierta.');r.onerror=()=>log('No se pudo eliminar la base temporal.');btn.disabled=false}}
</script></html>
