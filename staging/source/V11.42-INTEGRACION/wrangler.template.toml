# TEMPLATE ONLY. No production bindings, no deploy command in CI.
name = "asia-v1142-candidate-staging"
main = "server/index.mjs"
compatibility_date = "2026-11-20"
workers_dev = true
[assets]
directory = "./assets"
binding = "STAGING_PWA_ASSETS"
run_worker_first = true
[vars]
STAGING_MODE = "asia-v1111-identity-private"
STAGING_ORIGIN = "https://asia-v1142-candidate-staging.REPLACE-SUBDOMAIN.workers.dev"
STAGING_ALLOW_V1142_TESTS = "false"
STAGING_ALLOW_V1138_TESTS = "false"
STAGING_ALLOW_V1139_TESTS = "false"
[[d1_databases]]
binding = "STAGING_DB"
database_name = "asia-v1142-new-synthetic-db"
database_id = "REPLACE-NEW-D1-ID"
[[r2_buckets]]
binding = "STAGING_SYNC_OBJECTS"
bucket_name = "asia-v1142-new-synthetic-objects"
